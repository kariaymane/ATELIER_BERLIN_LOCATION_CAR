name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests
        working-directory: backend

  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rental_ci
          # Disposable runner-local test database; never a deployment credential.
          POSTGRES_PASSWORD: rental_ci
          POSTGRES_DB: car_rental_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rental_ci -d car_rental_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://localhost:5432/car_rental_ci
          TEST_DATABASE_URL_SYNC: postgresql+psycopg2://localhost:5432/car_rental_ci

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libopengl0
      - run: python -m pip install -r desktop/requirements-dev.txt
      - run: python -m pytest tests
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
          API_BASE_URL: http://127.0.0.1:59999
          CAR_RENTAL_DATA_DIR: ${{ runner.temp }}/desktop-test-data

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
        working-directory: mobile
