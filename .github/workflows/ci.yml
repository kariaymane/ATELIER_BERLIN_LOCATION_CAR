name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests --junitxml="$RUNNER_TEMP/tests.xml"
        working-directory: backend

      - name: Summarize tests
        if: always()
        run: python .github/scripts/test_summary.py "$RUNNER_TEMP/tests.xml"

  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rental_ci
          # Disposable runner-local test database; never a deployment credential.
          POSTGRES_PASSWORD: rental_ci
          POSTGRES_DB: car_rental_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rental_ci -d car_rental_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests --junitxml="$RUNNER_TEMP/tests.xml"
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://rental_ci:rental_ci@localhost:5432/car_rental_ci
          TEST_DATABASE_URL_SYNC: postgresql+psycopg2://rental_ci:rental_ci@localhost:5432/car_rental_ci

      - name: Summarize tests
        if: always()
        run: python .github/scripts/test_summary.py "$RUNNER_TEMP/tests.xml"

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libopengl0
      - run: python -m pip install -r desktop/requirements-dev.txt
      - run: python -m pytest tests --maxfail=1 --timeout=60 --junitxml="$RUNNER_TEMP/tests.xml"
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
          API_BASE_URL: http://127.0.0.1:59999
          CAR_RENTAL_DATA_DIR: ${{ runner.temp }}/desktop-test-data

      - name: Summarize tests
        if: always()
        run: python .github/scripts/test_summary.py "$RUNNER_TEMP/tests.xml"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test and build Android
        working-directory: mobile
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain testDebugUnitTest assembleDebug 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Summarize Android results
        if: always()
        run: python3 .github/scripts/test_summary.py mobile/app/build/test-results/testDebugUnitTest/TEST-*.xml --build-log "$RUNNER_TEMP/android-build.log"
