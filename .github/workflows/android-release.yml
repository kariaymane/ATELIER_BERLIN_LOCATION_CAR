name: Android release build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Build signed APK and app bundle
        working-directory: mobile
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          for name in API_BASE_URL KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required release setting: $name" >&2
              exit 1
            fi
          done
          trap 'rm -f -- "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          ./gradlew --no-daemon clean assembleRelease bundleRelease
      - name: Upload signed distributables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atelier-berlin-android-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            mobile/app/build/outputs/apk/release/*.apk
            mobile/app/build/outputs/bundle/release/*.aab
