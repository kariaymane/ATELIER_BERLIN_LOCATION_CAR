name: Android Release

on:
  push:
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x mobile/gradlew
      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/keystore.jks
          cd mobile
          ./gradlew clean assembleRelease bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atelier-berlin-location-car-android-release
          path: mobile/app/build/outputs/apk/release/*.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: atelier-berlin-location-car-android-release-aab
          path: mobile/app/build/outputs/bundle/release/*.aab
