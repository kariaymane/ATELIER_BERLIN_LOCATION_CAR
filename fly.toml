app = 'car-rental-system'
primary_region = 'cdg'

[build]
  dockerfile = "docker/Dockerfile.backend"

[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  # One machine stays warm at all times: the cold-start (3-15s) was the #1
  # cause of "login fails / erreur de connexion" on the desktop and phone
  # (FORENSIC_ROOT_CAUSE_ANALYSIS.md §2). A single always-on machine also
  # keeps the in-process EventBroadcaster (live WS events) continuously
  # available. auto_start still covers a burst needing a second machine.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = "uploads_vol"
  destination = "/app/uploads"
