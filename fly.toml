app = 'car-rental-system'
primary_region = 'cdg'

[build]
  dockerfile = "docker/Dockerfile.backend"

[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  # One machine stays warm at all times: eliminating cold-starts (3-15s)
  # prevents connection timeouts on desktop and phone clients. An always-on
  # machine also keeps the in-process EventBroadcaster (live WS events)
  # continuously available. auto_start covers bursts needing a second machine.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = "uploads_vol"
  destination = "/app/uploads"
